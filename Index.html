<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICKER | 나만의 향수 찾기 신청</title>
    <style>
        :root {
            --primary-color: #25442f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #ddd;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .checkbox-group, .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }
        .checkbox-group label, .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fafafa;
            padding: 6px 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #1a3222;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            color: #666;
        }
        .consent-box {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PICKER 신청하기</h2>
    <form id="pickerForm">
        <!-- 스팸 방지용 허니팟 필드 (화면에 보이지 않음) -->
        <input type="text" name="website" id="website" style="display:none !important" tabindex="-1" autocomplete="off">

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" required maxlength="30" placeholder="이름을 입력하세요">
        </div>

        <div class="form-group">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" required min="1" max="120" placeholder="나이를 숫자로 입력하세요">
        </div>

        <div class="form-group">
            <label>성별</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="여성" required> 여성</label>
                <label><input type="radio" name="gender" value="남성"> 남성</label>
                <label><input type="radio" name="gender" value="기타"> 기타</label>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">연락처 (- 없이 입력)</label>
            <input type="text" id="phone" name="phone" required placeholder="01012345678">
        </div>

        <div class="form-group">
            <label for="dong">사는 동</label>
            <input type="text" id="dong" name="dong" required maxlength="30" placeholder="예: 용문동">
        </div>

        <div class="form-group">
            <label>가능 요일 (중복 선택)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="days" value="월"> 월</label>
                <label><input type="checkbox" name="days" value="화"> 화</label>
                <label><input type="checkbox" name="days" value="수"> 수</label>
                <label><input type="checkbox" name="days" value="목"> 목</label>
                <label><input type="checkbox" name="days" value="금"> 금</label>
                <label><input type="checkbox" name="days" value="토"> 토</label>
                <label><input type="checkbox" name="days" value="일"> 일</label>
            </div>
        </div>

        <div class="form-group">
            <label>가능 시간 (중복 선택)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="times" value="13:00~14:00"> 13:00~14:00</label>
                <label><input type="checkbox" name="times" value="14:00~15:00"> 14:00~15:00</label>
                <label><input type="checkbox" name="times" value="15:00~16:00"> 15:00~16:00</label>
                <label><input type="checkbox" name="times" value="16:00~17:00"> 16:00~17:00</label>
                <label><input type="checkbox" name="times" value="17:00~18:00"> 17:00~18:00</label>
                <label><input type="checkbox" name="times" value="18:00~19:00"> 18:00~19:00</label>
                <label><input type="checkbox" name="times" value="19:00~20:00"> 19:00~20:00</label>
                <label><input type="checkbox" name="times" value="20:00~"> 20:00~</label>
            </div>
        </div>

        <div class="form-group">
            <label>요즘 나의 일상 (중복 선택)</label>
            <div class="checkbox-group" style="flex-direction: column; gap: 5px;">
                <label><input type="checkbox" name="dailyLife" value="수업과 과제, 공부로 바쁜 하루"> 수업과 과제, 공부로 바쁜 하루</label>
                <label><input type="checkbox" name="dailyLife" value="출근부터 퇴근까지, 회사 중심의 하루"> 출근부터 퇴근까지, 회사 중심의 하루</label>
                <label><input type="checkbox" name="dailyLife" value="취업 준비와 자기계발에 집중하는 하루"> 취업 준비와 자기계발에 집중하는 하루</label>
                <label><input type="checkbox" name="dailyLife" value="학교와 아르바이트를 병행하는 하루"> 학교와 아르바이트를 병행하는 하루</label>
            </div>
        </div>

        <div class="form-group">
            <label>향 찾기 방식</label>
            <div class="radio-group">
                <label><input type="radio" name="mode" value="image" required> 이미지로 찾기</label>
                <label><input type="radio" name="mode" value="mood"> 분위기로 찾기</label>
            </div>
        </div>

        <div class="form-group">
            <div class="consent-box">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent" style="margin:0; font-weight:normal; cursor:pointer;">[필수] 개인정보 수집·이용에 동의합니다.</label>
            </div>
        </div>

        <button type="submit" id="submitBtn">신청서 제출하기</button>
    </form>
    <div class="status" id="serverStatus">● 서버 연결 대기 중...</div>
</div>

<script>
    // ⚠️ 배포한 구글 앱스 스크립트 웹 앱 URL을 아래에 정확히 입력해주세요.
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx3t_N2ItKdJcJbTsZbYjRW3oUy9MUCHcct8U78wCIbK1Myeznv8O4UHYSWyZmbiWKC/exec';

    window.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById('serverStatus');
        if (GAS_WEB_APP_URL.includes('여기에_배포된_웹앱_URL을_입력하세요')) {
            statusEl.innerHTML = '⚠️ 코드 내에 GAS 웹 앱 URL을 설정해주세요.';
            statusEl.style.color = '#dc3545';
        } else {
            statusEl.innerHTML = '● 접수 서버 연결됨 · 신청서를 작성할 수 있어요.';
            statusEl.style.color = '#28a745';
        }
    });

    document.getElementById('pickerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (GAS_WEB_APP_URL.includes('여기에_배포된_웹앱_URL을_입력하세요')) {
            alert('먼저 HTML 파일 내의 GAS_WEB_APP_URL 값을 올바른 웹 앱 URL로 수정해주세요.');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('serverStatus');

        // 체크박스 값 수집 함수
        function getCheckedValues(name) {
            const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // 고유 접수 ID 생성 (12자 이상)
        const submissionId = 'sub_' + Math.random().toString(36).substring(2, 9) + Date.now();

        // 전송할 데이터 객체 구성
        const formData = {
            submissionId: submissionId,
            website: document.getElementById('website').value, // 스팸 방지 필드
            name: document.getElementById('name').value.trim(),
            age: document.getElementById('age').value,
            gender: document.querySelector('input[name="gender"]:checked')?.value || '',
            phone: document.getElementById('phone').value.trim(),
            dong: document.getElementById('dong').value.trim(),
            days: getCheckedValues('days'),
            times: getCheckedValues('times'),
            dailyLife: getCheckedValues('dailyLife'),
            mode: document.querySelector('input[name="mode"]:checked')?.value || '',
            consent: document.getElementById('consent').checked
        };

        submitBtn.disabled = true;
        submitBtn.innerText = '제출 중...';
        statusEl.innerHTML = '데이터를 전송하는 중입니다...';

        // Fetch API를 이용한 POST 요청 (CORS 이슈 우회를 위한 text/plain 헤더 사용)
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            if (result.ok) {
                alert('성공적으로 접수되었습니다!\n접수번호: ' + result.receipt);
                document.getElementById('pickerForm').reset();
            } else {
                alert('접수 실패: ' + (result.error || '입력 정보를 다시 확인해주세요.'));
            }
        })
        .catch(error => {
            console.error('통신 에러:', error);
            alert('서버와 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = '신청서 제출하기';
            statusEl.innerHTML = '● 접수 서버 연결됨 · 신청서를 작성할 수 있어요.';
        });
    });
</script>

</body>
</html>
