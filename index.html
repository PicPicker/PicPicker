function pickerJsonp(params,timeoutMs=15000){
 return new Promise((resolve,reject)=>{
  const cb='pickerCb_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const tag=document.createElement('script');
  const timer=setTimeout(()=>{cleanup();reject(new Error('접수 서버 응답이 없어요. 웹 앱 배포 설정(실행: 나 / 액세스: 모든 사용자)을 확인해 주세요.'))},timeoutMs);
  function cleanup(){clearTimeout(timer);try{delete window[cb]}catch{window[cb]=undefined}tag.remove();}
  window[cb]=data=>{cleanup();resolve(data)};
  tag.onerror=()=>{cleanup();reject(new Error('접수 서버에 연결하지 못했어요.'))};
  tag.src=PICKER_GAS_WEB_APP_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});
  document.head.appendChild(tag);
 });
}

}

async function sendApplicationToSheet(payload,onProgress){
 const makeBody=()=>new URLSearchParams({payload:JSON.stringify(payload)});
 if(onProgress)onProgress('구글 스프레드시트에 신청 내용을 저장하고 있어요.');
 let response=null;
 try{
  const res=await fetch(PICKER_GAS_WEB_APP_URL,{method:'POST',body:makeBody(),redirect:'follow'});
  response=await res.json();
 }catch(error){
  try{await fetch(PICKER_GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',body:makeBody()});}catch{}
 }
 if(response){
  if(response.ok===true&&String(response.receipt)===String(payload.submissionId))return response;
  if(response.ok===false)throw new Error(response.error||'신청을 저장하지 못했어요.');
 }
 if(onProgress)onProgress('저장되었는지 확인하고 있어요.');
 for(let i=0;i<6;i++){
  try{
   const st=await pickerJsonp({action:'status',submissionId:payload.submissionId});
   if(st&&st.ok===true&&String(st.receipt)===String(payload.submissionId))return st;
  }catch{}
  await new Promise(r=>setTimeout(r,2000));
 }
 throw new Error('저장 완료를 확인하지 못했어요. 잠시 후 다시 제출해 주세요.');
}

function resetTest(all=true){state=emptyImageState();moodState=emptyMoodState();result=false;step=0;if(all)testMode=''}
function activeQuestions(){return testMode==='mood'?moodQuestions:imageQuestions}
function moodDimensions(s=moodState){
 const dims={ei:'?',sn:'?',tf:'?',jp:'?'};
 for(const [dim,a,b] of [['ei','E','I'],['sn','S','N'],['tf','T','F'],['jp','J','P']]){
   const answers=moodQuestions.filter(q=>q.dim===dim).map(q=>s[q.key]).filter(v=>v===a||v===b);
   // Legacy 4-question records still display accurately.
   if(!answers.length&&[a,b].includes(s[dim])){dims[dim]=s[dim];continue}
   const ca=answers.filter(v=>v===a).length,cb=answers.filter(v=>v===b).length;
   dims[dim]=ca>cb?a:cb>ca?b:'?';
 }
 return dims
}
function mbtiType(s=moodState){const d=moodDimensions(s);return [d.ei,d.sn,d.tf,d.jp].join('')}
const mbtiDescriptions={E:'활기와 외부 자극을 반영한 타입',I:'차분함과 개인 리듬을 반영한 타입',S:'선명하고 현실적인 취향을 반영한 타입',N:'감성적이고 여운 있는 취향을 반영한 타입',T:'또렷하고 구조적인 인상을 선호하는 타입',F:'부드럽고 호감 가는 인상을 선호하는 타입',J:'정돈되고 안정적인 무드를 선호하는 타입',P:'자유롭고 가벼운 무드를 선호하는 타입'};
function moodToState(s=moodState){
 s=moodDimensions(s);
 const out=emptyImageState();
 if(s.ei==='E'){out.personality.push('밝은','활기찬');out.charm.push('당당한')} else if(s.ei==='I'){out.personality.push('차분한','부드러운');out.charm.push('미니멀')}
 if(s.sn==='S'){out.styles.push('산뜻한','자연스러운');out.likes.push('시트러스','그린')} else if(s.sn==='N'){out.styles.push('도시적인','미니멀');out.likes.push('머스크','우디')}
 if(s.tf==='T'){out.styles.push('세련된');out.charm.push('세련된','시크한')} else if(s.tf==='F'){out.styles.push('로맨틱');out.charm.push('사랑스러운','우아한')}
 if(s.jp==='J'){out.styles.push('우아한');out.personality.push('차분한');out.likes.push('머스크')} else if(s.jp==='P'){out.styles.push('자연스러운');out.personality.push('활기찬');out.likes.push('프루티')}
 for(const k of ['styles','personality','charm','likes','dislikes'])out[k]=[...new Set(out[k])]
 return out
}
function currentState(){return testMode==='mood'?moodToState(moodState):state}
function stateFromHistoryEntry(h){if(!h)return null;if(h.mode==='mood')return moodToState(h.mbti||emptyMoodState());return h.state||null}

function renderMy(){const s=shownState(), v=scentProfile(s), five=[['🍋','시트러스/그린',(v['시트러스']||0)+(v['그린']||0)],['🌸','플로럴',v['플로럴']||0],['🌲','우디',v['우디']||0],['☁️','머스크',v['머스크']||0],['🌶️','스파이시',v['스파이시']||0]];const max=Math.max(1,...five.map(x=>x[2]));const profileReady=!!s;const favItems=favorites.map(key=>scents.find(p=>scentKey(p)===key)).filter(Boolean);return `<div class="my-greeting"><div class="meta">MY PICKER · SCENT PROFILE</div><p class="my-hi">안녕하세요 ☁️</p><div class="my-name">${esc(userName||'향을 찾는 당신')}<button id="editName">${userName?'수정':'이름 설정'}</button></div>${editingName?'<div class="p-edit"><input id="nameInput" maxlength="15" placeholder="이름 또는 닉네임" value="'+esc(userName)+'"><button id="nameSave">저장</button></div>':''}</div><section class="profile-panel"><div class="profile-heading"><h2>나의 향 프로필</h2><span class="profile-meta">${profileReady?'최근 분석 기반':'분석 전'}</span></div><p class="profile-sub">나의 선택을 향의 도형으로 보여드려요.</p>${profileReady?radarSvg(v):'<div class="scent-placeholder">아직 분석 결과가 없어요. 이미지로 찾기 또는 분위기로 찾기를 완료하면 나만의 선호 향 도형이 나타납니다.</div>'}${profileReady?'<div class="profile-chips">'+five.map(([emoji,n,score])=>`<span class="profile-chip">${emoji} ${n} ${Math.round(score/max*15)}점</span>`).join('')+'</div><p class="profile-legend">15점 기준 상대 점수 · 진단/선호 입력을 시각화한 참고 지표</p>':''}<div class="tags">${(s?.likes||[]).map(n=>`<span class="tag">선호 · ${esc(n)}</span>`).join('')}${(s?.dislikes||[]).map(n=>`<span class="tag">기피 · ${esc(n)}</span>`).join('')}</div></section><section class="profile-panel"><div class="profile-heading"><h2>즐겨찾기</h2><span class="profile-meta">${favItems.length}개</span></div><p class="profile-sub">눈여겨본 향수를 모아뒀어요.</p>${favItems.length?favItems.map(p=>`<div class="favrow"><div><div class="brand">${esc(p.brand)}</div><b>${esc(p.displayName||p.name)}</b></div><div style="display:flex;gap:5px"><button data-fav-open="${scents.indexOf(p)}">상세</button><button data-fav-remove="${esc(scentKey(p))}" aria-label="즐겨찾기 해제">♥</button></div></div  const goBack=()=>{detailIndex=null;page=previousPage;render();scrollTo(0,0)};
 $('#closeDetail')?.addEventListener('click',goBack);$('#closeDetailBottom')?.addEventListener('click',goBack);
 $('#catalogSearch')?.addEventListener('input',e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const input=$('#catalogSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}});
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const q=imageQuestions[step],v=b.dataset.choice;if(q.key==='dislikes'){const selected=state.dislikes;if(selected.includes(v)){state.dislikes=selected.filter(x=>x!==v)}else if(selected.length<q.max){state.dislikes=[...selected,v]}else {alert(`최대 ${q.max}개까지 선택할 수 있어요.`);return}render();return}state[q.key]=[v];advanceQuestion()});
 document.querySelectorAll('[data-mbti-choice]').forEach(b=>b.onclick=()=>{const q=moodQuestions[step];moodState[q.key]=b.dataset.mbtiChoice;advanceQuestion()});
 $('#changeMode')?.addEventListener('click',()=>{resetTest(true);render();scrollTo(0,0)});
 $('#back')?.addEventListener('click',()=>{step--;render();scrollTo(0,0)});
 $('#skip')?.addEventListener('click',()=>{if(testMode!=='image')return;const q=imageQuestions[step];if(!q.optional)return;if(q.key!=='dislikes'||!state.dislikes.length)state[q.key]=[];advanceQuestion()});
 $('#restart')?.addEventListener('click',()=>{resetTest(true);render();scrollTo(0,0)});
 $('#save')?.addEventListener('click',()=>{const top=(testMode==='mood'?moodRecommendation(moodState):recommendation(state)).ranked[0]?.name||'조건에 맞는 추천 없음';history.unshift({date:new Date().toLocaleDateString('ko-KR'),mode:testMode||'image',state:structuredClone(state),mbti:structuredClone(moodState),top});history=history.slice(0,40);try{localStorage.setItem('picker_v6_diary',JSON.stringify(history));alert('향의 일기에 저장했어요.')}catch{alert('기기 저장 공간을 확인해주세요.')}});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const h=history[Number(b.dataset.open)];testMode=h.mode||'image';state=structuredClone(h.state||emptyImageState());moodState=structuredClone(h.mbti||emptyMoodState());for(const k of ['styles','personality','charm','likes','dislikes'])state[k]||(state[k]=[]);page='test';result=true;render();scrollTo(0,0)});
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{history.splice(Number(b.dataset.delete),1);localStorage.setItem('picker_v6_diary',JSON.stringify(history));render()});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 $('#clear')?.addEventListener('click',()=>{if(confirm('저장 기록을 모두 삭제할까요?')){history=[];localStorage.removeItem('picker_v6_diary');render()}})
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{page=b.dataset.tab;detailIndex=null;render();scrollTo(0,0)});render();
</script></body></html>
